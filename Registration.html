<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together we can</title>
    <style>
        body {
            background-color: blanchedalmond;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: #938e8e;
            color: rgb(56, 47, 34);
            padding: 10px;
        }

        nav img {
            width: 80px;
            height: 80px;
            border-radius: 50px;
        }

        nav div {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: black;
            text-decoration: underline;
            font-size: larger;
        }

        nav a:hover {
            color: rgb(167, 19, 137);
        }

        .registration-container {
            padding: 50px 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: rgb(235, 229, 229);
            border-radius: 25px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 1.1em;
            margin-bottom: 5px;
            display: block;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group button {
            background-color: rgb(167, 19, 137);
            color: white;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .form-group button:hover {
            background-color: rgb(123, 14, 97);
        }

        .footer {
            background-color: #938e8e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
  </style>   
</head>
<body>
    <nav>
        <img src="logo.png.png" alt="Together we can">
        <div></div>
        <div>
            <a href="#">DONATE TO PROJECTS</a>
            <a href="HOME.html">Home</a>
            <a href="#">About</a>
            <a href="Impact.html">Impact</a>
            <a href="Registration.html">Registration</a>
        </div>
    </nav>
    <div class="registration-container">
        <h1>Registration Form</h1>

        <form action="submit_registration.php" method="POST">
            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a password" required>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Why do you want to join us?</label>
                <textarea id="message" name="message" placeholder="Write a short message about why you want to join us" required></textarea>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit">Register Now</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 Together We Can. All Rights Reserved.</p>
    </div>

</body>
</html>
