    <style>
        body {
            background-color: blanchedalmond;
            margin: 0;
            padding: 0;
        }
        nav {
            display: flex;
            justify-content: space-between;
            background-color: #938e8e;
            color: rgb(56, 47, 34);
            padding: 10px;
        }
        nav img {
            width: 80px;
            height: 80px;
            border-radius: 50px;
        }
        nav div {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: black;
            text-decoration: underline;
            font-size: larger;
        }
        .gallery-container {
            display: flex;
            flex-wrap: wrap; /* Ensure items wrap to the next line */
            gap: 20px; /* Space between boxes */
            justify-content: space-between; /* Distribute items evenly across rows */
            padding: 20px;
        }
        .gallery-item {
            flex: 1 1 250px; /* Flexible items, with a base width of 250px */
            background: rgb(235, 229, 229);
            text-decoration-line: underline;
            padding: 10px;
            border-radius: 25px;
            height: 210px;
            display: flex;
            width: 210;
            justify-content: center;
            align-items: center;
            margin-top: 20px; /* Space from the top of the container */
            box-sizing: border-box; /* Ensure padding doesn't affect the box size */
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%; /* Make the image fit the container */
            height: auto; /* Maintain aspect ratio */
            object-fit: cover;
            height: 100%;
            border-radius: 25px;
            transition: opacity 0.3s ease;
            display: block;
        }
        .gallery-item h3 {
            position: absolute; /* Position text over the image */
            top: 50%; /* Center the text vertically */
            left: 50%; /* Center the text horizontally */
            transform: translate(-50%, -50%); /* Center the text exactly in the middle */
            color: white; /* White text for contrast */
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background for readability */
            padding: 10px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            opacity: 0; /* Initially hide the text */
            transition: opacity 0.3s ease; /* Smooth transition for opacity */
            display: inline-block;
        }
        .gallery-item:hover h3 {
            opacity: 1; /* Show the text on hover */
        }

        .gallery-item:hover img {
            opacity: 0.3; /* Dim the image on hover */
        }

        
    </style>
